<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5544e9" />
    <title>Runalytics — Calendar</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <nav id="nav" aria-label="Main">
      <span class="brand">Runalytics</span>
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="plan.html" class="nav-link">Plan</a>
      <a href="calendar.html" class="nav-link active">Calendar</a>
      <a href="injury.html" class="nav-link">Injuries</a>
      <a href="achievements.html" class="nav-link">Achievements</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </nav>
    <main id="app">
      <section id="calendar" class="panel">
        <header class="panel-head">
          <h2>Training calendar</h2>
          <div class="cal-nav">
            <button
              id="cal-prev"
              class="icon-btn"
              type="button"
              aria-label="Previous month"
            >
              <span data-icon="arrowLeft"></span>
            </button>
            <span id="cal-title" aria-live="polite"></span>
            <button
              id="cal-next"
              class="icon-btn"
              type="button"
              aria-label="Next month"
            >
              <span data-icon="arrowRight"></span>
            </button>
          </div>
        </header>
        <div id="cal-week" aria-label="This week"></div>
        <p class="cal-adjusted" id="cal-adjusted" hidden></p>
        <p class="cal-hint">
          Drag a session (or open it and use
          <strong>Move to…</strong>) to reschedule the week you're in. To change
          the plan itself, use
          <a href="plan.html">Plan</a>
          — that rebuilds every week, this only moves one run.
        </p>
        <div id="cal-grid"></div>
        <div id="cal-agenda"></div>
      </section>
    </main>
    <script type="module" src="/src/calendar.ts"></script>
  </body>
</html>
