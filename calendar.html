<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Runalytics — Calendar</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <nav id="nav" aria-label="Main">
      <span class="brand">Runalytics</span>
      <a href="index.html" class="nav-link">Today</a>
      <a href="plan.html" class="nav-link">Plan</a>
      <a href="calendar.html" class="nav-link active">Calendar</a>
      <a href="injury.html" class="nav-link">Injuries</a>
      <a href="achievements.html" class="nav-link">Progress</a>
      <a href="support.html" class="nav-link">Support</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </nav>
    <main id="app">
      <section id="calendar" class="panel">
        <header class="panel-head">
          <div class="cal-nav">
            <button
              id="cal-prev"
              class="icon-btn"
              type="button"
              aria-label="Previous month"
            >
              <span data-icon="arrowLeft"></span>
            </button>
            <span id="cal-title" aria-live="polite"></span>
            <button
              id="cal-next"
              class="icon-btn"
              type="button"
              aria-label="Next month"
            >
              <span data-icon="arrowRight"></span>
            </button>
          </div>
          <div class="calendar-view-toggle" role="group" aria-label="Calendar view">
            <button type="button" id="calendar-agenda-view" aria-pressed="true">Agenda</button>
            <button type="button" id="calendar-expand" aria-pressed="false" aria-controls="cal-grid">Month</button>
          </div>
        </header>
        <p class="cal-adjusted" id="cal-adjusted" hidden></p>
        <div class="calendar-filter-bar"><button type="button" id="cal-today" class="secondary">Today</button><span id="cal-selection" role="status"></span><button type="button" id="cal-clear" class="secondary" hidden>All dates</button></div>
        <div class="calendar-workspace"><div id="cal-grid"></div>
        <div id="cal-agenda"></div></div>
      </section>
    </main>
    <script type="module" src="/src/calendar.ts"></script>
  </body>
</html>
