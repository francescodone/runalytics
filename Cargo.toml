[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/plan-engine",
    "crates/scoring",
    "crates/calendar",
    "crates/provider-core",
    "crates/provider-coros",
    "crates/provider-garmin",
    "crates/mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/francescodone/runalytics"
authors = ["Fran Duran"]

[workspace.dependencies]
# --- internal ---
runalytics-core = { path = "crates/core" }
runalytics-store = { path = "crates/store" }
runalytics-plan-engine = { path = "crates/plan-engine" }
runalytics-scoring = { path = "crates/scoring" }
runalytics-calendar = { path = "crates/calendar" }
runalytics-provider-core = { path = "crates/provider-core" }
runalytics-provider-coros = { path = "crates/provider-coros" }
runalytics-provider-garmin = { path = "crates/provider-garmin" }

# --- foundation ---
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = { version = "0.10", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "rng", "serde"] }

# --- serialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

# --- persistence ---
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json"] }

# --- calendar ---
icalendar = "0.17"

# --- mcp ---
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }

# --- http / net ---
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
url = { version = "2", features = ["serde"] }

# --- macOS ---
security-framework = "3"

# --- tauri ---
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
