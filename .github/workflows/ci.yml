name: CI

# Quality gate for the Cargo workspace: formatting, lints, and tests on every
# push and pull request. Each job runs a Makefile target, so a branch that
# passes `make check` locally is green here too.
#
# Runs on macOS hosts: the desktop shell is a Tauri app that pulls in
# security-framework and keyring's apple-native backend, so the workspace does
# not build on Linux. Same host the release pipeline uses. Only the fmt job runs
# on Linux, since rustfmt does not need to link anything.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep build metadata out of cache keys and shrink artifacts.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Cheap and host-independent, so it stays on the fast Linux runner.
      - name: Check formatting
        run: make fmt

  clippy:
    name: Lints
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # macOS host so the desktop shell (Tauri + security-framework) is linted
      # too; on Linux those crates cannot be built.
      #
      # Hard gate: the pedantic lints the workspace used to carry are cleared.
      # Two are allowed at the workspace level in Cargo.toml rather than fixed —
      # doc_markdown (this domain is written in physiology language: VO2max,
      # ACWR, TSS) and match_same_arms (the phase/experience tables legitimately
      # share values between neighbouring levels).
      - name: Clippy
        run: make clippy

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # --all-targets also compiles benches/examples, so this covers the build
      # step as well.
      - name: Run tests
        run: make test
