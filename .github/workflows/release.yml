name: Release

# Publish a GitHub Release with the macOS app bundles whenever a version tag
# (e.g. v0.1.0) is pushed. To cut a release:
#
#   # the version lives in exactly one place: [workspace.package] version in
#   # the root Cargo.toml, inherited by every crate including the desktop shell.
#   # tauri.conf.json omits `version`, so the bundle version follows Cargo too.
#   sed -i '' 's/^version = "0.1.0"/version = "0.2.0"/' Cargo.toml && cargo update -w
#   git commit -am "chore: release v0.2.0" && git push
#   git tag v0.2.0 && git push origin v0.2.0
#
# The .app is built but NOT signed with an Apple Developer ID here (that needs
# paid Apple credentials), so first launch still goes through the
# Privacy & Security -> Open Anyway flow. There is no in-app updater configured,
# so no minisign/updater key is required to cut a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag & release (e.g. 0.1.0), no leading 'v'"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Create GitHub release and build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: v__VERSION__
          releaseName: "Runalytics v__VERSION__"
          releaseBody: "See the assets below to download Runalytics for macOS."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
