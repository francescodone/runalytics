name: Release

# Publish a draft GitHub Release with the macOS app bundles whenever a version
# tag (e.g. v0.2.0) is pushed. To cut a release:
#
#   ./scripts/bump_version.sh 0.2.0
#   git commit -am "chore: release v0.2.0" && git push
#   git tag v0.2.0 && git push origin v0.2.0
#
# Or just run ./scripts/release.sh v0.2.0, which commits, tags, pushes, and
# publishes locally without CI. If CI builds the tag first, run
# `gh release delete v0.2.0 -y` before re-running the local script.
#
# Both Apple-silicon and Intel DMGs are built, along with an iOS IPA. The
# macOS bundles are signed with the minisign updater key (TAURI_SIGNING_PRIVATE_
# KEY in repo secrets) so tauri-action can publish the .app.tar.gz + .sig and a
# latest.json next to them — that manifest is what the in-app updater in
# Settings → About reads. The macOS app itself is ad-hoc-signed via
# bundle.macOS.signingIdentity in tauri.conf.json (the bundler must seal the
# bundle, or Gatekeeper calls it damaged on other machines); it is not
# notarised, so first launch needs right-click -> Open. The IPA is deliberately
# unsigned and installs through Sideloadly, which signs it with the recipient's
# own Apple ID.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Build app bundle (tauri-action creates/updates the draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundle so the action can emit the .sig and
          # latest.json. Without this the build fails outright: tauri-cli
          # refuses to bundle when a pubkey is configured but the private key
          # env var is missing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "Runalytics v__VERSION__"
          releaseBody: "See the assets below to download Runalytics for macOS (arm64 for Apple silicon, x86_64 for Intel) or iPhone (the .ipa, installed with Sideloadly - see the README)."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # The DMG is built with hdiutil makehybrid (see scripts/make_dmg.sh)
      # rather than Tauri's DMG step. BUNDLE_DIR/ARCH are overridden because
      # a cross-target build lands in target/<triple>/release and the runner
      # CPU is arm64 regardless of the target.
      - name: Build DMG
        env:
          BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle
          ARCH: ${{ matrix.arch }}
        run: bash scripts/make_dmg.sh

      - name: Upload DMG to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "v$VERSION" \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg --clobber

  # The iOS artifact is an unsigned IPA that Sideloadly re-signs with each
  # recipient's own Apple ID (see scripts/build_ios.sh), so this job needs no
  # certificate, no provisioning profile and no App Store Connect key.
  #
  # It is a separate job rather than another matrix leg because a macOS
  # cross-target build and an iOS build would fight over the same cargo lock.
  # It still waits on `publish`, because tauri-action in that job is what
  # creates the draft release: `gh release upload` fails against a release that
  # does not exist yet, so racing it would lose the IPA.
  ios:
    needs: publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      # The Xcode scaffold under src-tauri/gen/apple is committed, so no
      # `tauri ios init` and no CocoaPods: the Podfile declares zero pods and
      # the CLI only runs `pod install` from init, never from build.
      - name: Build unsigned IPA
        run: bash scripts/build_ios.sh

      - name: Upload IPA to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "v$VERSION" \
            src-tauri/gen/apple/build/Runalytics_${VERSION}.ipa --clobber
