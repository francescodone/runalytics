name: Release

# Publish a GitHub Release with the macOS app bundles whenever a version tag
# (e.g. v0.1.0) is pushed. To cut a release:
#
#   # the version lives in exactly one place: [workspace.package] version in
#   # the root Cargo.toml, inherited by every crate including the desktop shell.
#   sed -i '' 's/^version = "0.1.0"/version = "0.2.0"/' Cargo.toml && cargo update -w
#   git commit -am "chore: release v0.2.0" && git push
#   git tag v0.2.0 && git push origin v0.2.0
#
# The app bundle is signed with the updater key (minisign), which is what the
# in-app updater verifies — store the private key as the repository secret
# TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/runalytics.key). It is NOT
# Apple Developer ID signing, so first launch still needs the
# Privacy & Security -> Open Anyway flow.
#
# Requires apps/desktop/src-tauri/tauri.conf.json to exist; the desktop crate
# is currently Rust-only and the bundle step is skipped until it is scaffolded.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag & release (e.g. 0.1.0), no leading 'v'"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Create GitHub release and build app (first target only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign private key (contents of ~/.tauri/runalytics.key).
          # Required because tauri.conf.json sets an updater pubkey +
          # createUpdaterArtifacts; without it the build fails when signing
          # the updater tarball.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: v__VERSION__
          releaseName: "Runalytics v__VERSION__"
          releaseBody: "See the assets below to download Runalytics for macOS."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
