<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icon preview</title>
    <style>
      body { background: #0e1116; color: #e8eaed; font: 13px/1.4 system-ui; padding: 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 16px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border: 1px solid #232a33; border-radius: 10px; }
      .cell svg { font-size: 32px; }
      .row { display: flex; gap: 10px; font-size: 15px; margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <div class="row" id="row"></div>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { icons } from "/src/lib/icons.ts";
      const grid = document.getElementById("grid");
      const row = document.getElementById("row");
      for (const [name, svg] of Object.entries(icons)) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = svg + "<span>" + name + "</span>";
        grid.appendChild(cell);
        row.insertAdjacentHTML("beforeend", svg);
      }
    </script>
  </body>
</html>
