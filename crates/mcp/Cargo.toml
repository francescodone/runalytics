rmcp.workspace = true
runalytics-calendar.workspace = true
runalytics-core.workspace = true
runalytics-plan-engine.workspace = true
runalytics-provider-core.workspace = true
runalytics-scoring.workspace = true
runalytics-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
