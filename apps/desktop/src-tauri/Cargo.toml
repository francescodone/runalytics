[package]
name = "runalytics-desktop"
description = "Runalytics desktop shell: Tauri commands, sidecar lifecycle, tray and window management."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Tauri expects the crate name to differ from the product name; the bundle
# identifier and product name come from tauri.conf.json.

[lib]
name = "runalytics_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "runalytics-desktop"
path = "src/main.rs"

[features]
default = []
# Enables the devtools in debug builds only; wired from tauri.conf.json.
devtools = ["tauri/devtools"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
keyring = { version = "3", features = ["apple-native"] }
reqwest.workspace = true
runalytics-core.workspace = true
runalytics-mcp.workspace = true
runalytics-provider-core.workspace = true
runalytics-provider-coros.workspace = true
runalytics-provider-garmin.workspace = true
runalytics-store.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-store.workspace = true
tauri.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build.workspace = true

[lints]
workspace = true
