<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runalytics</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #181b21;
        --line: #262a33;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --accent: #569cff;
        --good: #3ddc84;
        --warn: #ffb454;
        --bad: #ff6b6b;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 46px 28px 14px; /* room for the overlay title bar */
        -webkit-app-region: drag;
      }
      header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      header .spacer { flex: 1; }
      button {
        -webkit-app-region: no-drag;
        background: var(--panel); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        padding: 6px 14px; font-size: 13px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      main { display: grid; grid-template-columns: 1fr 320px; gap: 18px; padding: 0 28px 28px; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; padding: 16px;
      }
      .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
      .card .big { font-size: 30px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
      .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .side { display: flex; flex-direction: column; gap: 14px; }
      .list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
      .row {
        display: flex; justify-content: space-between; gap: 10px;
        padding: 9px 11px; background: #14171d; border: 1px solid var(--line);
        border-radius: 9px; font-size: 13px;
      }
      .row .muted { color: var(--muted); }
      .pill { border-radius: 999px; padding: 2px 9px; font-size: 11px; background: #22262f; }
      .pill.ok { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
      #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--muted); max-height: 220px; overflow: auto; }
      section.full { grid-column: 1 / -1; }
      form { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; align-items: end; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
      input, select {
        background: #14171d; border: 1px solid var(--line); color: var(--text);
        border-radius: 8px; padding: 7px 10px; font-size: 13px; min-width: 130px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Runalytics</h1>
      <span class="spacer"></span>
      <button id="btn-sync">Sync wearables</button>
      <button id="btn-calendar">Publish to Calendar</button>
      <button id="btn-connect" class="primary">Connect COROS</button>
    </header>
    <main>
      <div class="cards" id="cards"></div>
      <div class="side">
        <div class="card">
          <h3>Next session</h3>
          <div id="next" class="sub">—</div>
        </div>
        <div class="card">
          <h3>Accounts</h3>
          <div class="list" id="accounts"></div>
        </div>
        <div class="card">
          <h3>Agent access (MCP)</h3>
          <div id="mcp" class="sub">—</div>
        </div>
      </div>
      <div class="card full">
        <h3>Generate a plan</h3>
        <form id="plan-form">
          <label>Goal
            <select id="goal">
              <option value="marathon">Marathon</option>
              <option value="half_marathon" selected>Half marathon</option>
              <option value="ten_k">10k</option>
              <option value="five_k">5k</option>
              <option value="recovery">Recovery</option>
              <option value="maintain">Maintain</option>
            </select>
          </label>
          <label>Weeks <input id="weeks" type="number" value="8" min="4" max="10" /></label>
          <button class="primary" type="submit">Generate &amp; activate</button>
        </form>
      </div>
      <div class="card full"><h3>Activity</h3><div id="log"></div></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
