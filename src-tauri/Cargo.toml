[package]
name = "runalytics"
version = "0.6.0"
description = "Training analytics for runners"
edition = "2021"

[lib]
name = "runalytics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Garmin Connect has no official public API; support is opt-in.
garmin = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# 0.13 is required: rmcp 3.5 depends on reqwest ^0.13.2. rustls is the
# default TLS backend in 0.13 (the old "rustls-tls" feature no longer exists).
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "auth"] }
keyring = { version = "4.2", features = ["apple-native-keyring-store"] }
rustyfit = "0.10"
embedded-io-adapters = { version = "0.7", features = ["std"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
