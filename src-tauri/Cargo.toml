[package]
name = "runalytics"
version = "0.12.0"
description = "Training analytics for runners"
edition = "2021"

[lib]
name = "runalytics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Garmin Connect has no official public API; support is opt-in.
garmin = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# 0.13 is required: rmcp 3.5 depends on reqwest ^0.13.2. rustls is the
# default TLS backend in 0.13 (the old "rustls-tls" feature no longer exists).
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "auth"] }
keyring = { version = "4.2", features = ["apple-native-keyring-store"] }
# The Entry type `keyring` wraps. Needed directly because on iOS the entry has
# to be built from an explicit store (see `secure_store`), and going through
# that store bypasses `keyring`'s macOS-only default-store install.
keyring-core = "1.0"
rustyfit = "0.10"
# Already in the tree as rustls' crypto backend (and already cross-compiled for
# iOS), so naming it directly adds no new native build. Used by `plan_sync` to
# seal a plan before it is uploaded to GitHub.
aws-lc-rs = "1"
embedded-io-adapters = { version = "0.7", features = ["std"] }
thiserror = "2"

# `keyring` ships no iOS credential store, and its Apple backend refuses to
# compile on iOS unless the `protected` feature is on. Scoped to iOS so macOS
# dependency resolution is untouched. iOS code must talk to this store
# directly — `keyring::Entry` reports `NoDefaultStore` on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
