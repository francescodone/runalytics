<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runalytics plan harness</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script>
      localStorage.setItem("runalytics.onboarding.v2", "done");
      const iso = (n) => new Date(Date.now() - n * 864e5).toISOString();
      const ymd = (n) => iso(n).slice(0, 10);
      // Matches the backend's receipt date format: "5 Jan", not "2026-12-15".
      const shortDate = (s) =>
        new Date(s + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });

      // A plan whose quality sessions were run in the past, so the pacing panel
      // has something to grade. The offset fields are the ones the range bars
      // read; ?offset=-5 shifts every future range to prove the bars move.
      const params = new URLSearchParams(location.search);
      const offset = Number(params.get("offset") ?? 0);
      const plan = {
        id: "p1",
        distance: "10K",
        kind: "race",
        targetDate: ymd(-49),
        status: "active",
        weeklyFrequency: 4,
        longrunDay: 7,
        increase: "moderate",
        thresholdSecKm: 285,
        createdAt: iso(70),
        pushedId: null,
        baselineWeeklyKm: 40,
        qualityOffsetSecKm: offset,
        qualityOffsetFrom: offset === 0 ? null : ymd(0),
      };

      // Seven weeks: easy / tempo / easy / long run, all dated in the past so
      // the quality sessions are gradeable. Bands are the plan's own tempo and
      // easy ranges.
      const workouts = [];
      const weekShape = [
        // [kind, days before today within the week, distance, band lo, band hi]
        ["easy", 3, 6000, 360, 400],
        ["tempo", 1, 8000, 280, 290],
        ["easy", 5, 6000, 360, 400],
        ["longRun", 0, 14000, 370, 420],
      ];
      for (let week = 6; week >= 0; week--) {
        const back = week * 7;
        for (const [kind, inWeek, dist, lo, hi] of weekShape) {
          const ago = back + inWeek;
          workouts.push({
            id: `w-${week}-${kind}`,
            planId: "p1",
            date: ymd(ago),
            kind,
            title:
              kind === "tempo"
                ? "3 x 1.0 km tempo"
                : kind === "longRun"
                  ? "Long run 14 km"
                  : "Easy run 6 km",
            distanceM: dist,
            durationMin: Math.round(dist / 200),
            paceLoSKm: lo,
            paceHiSKm: hi,
            done: true,
          });
        }
      }
      workouts.sort((a, b) => a.date.localeCompare(b.date));

      // Where the reps actually landed. The streak counts consecutively from
      // the newest session backwards, so ?streak=2 makes the two most recent
      // tempo runs too fast and the older one in range; ?streak=3 makes all
      // three too fast, which is the state that offers an adjustment.
      //
      // Computed per call, because accepting the offer moves the plan's offset
      // and the real backend re-grades the same runs against the shifted bands
      // — which spends the streak. A stub that froze the report would show the
      // panel still claiming an adjustment after one was applied.
      const graded = workouts.filter((w) => w.kind === "tempo" || w.kind === "intervals");
      const makeReport = () => {
        const applied = window.__offerAnswered === true;
        const streak = applied ? 0 : Number(params.get("streak") ?? 2);
        // Mirrors `pacing::reviews`: sessions dated before the plan's offset
        // took effect were read under the old ranges and drop out — which is
        // why the panel has a "just applied" state rather than rows.
        const gradeable = graded.filter(
          (w) => plan.qualityOffsetFrom == null || w.date >= plan.qualityOffsetFrom,
        );
        const reviews = gradeable.slice(-3).map((w, i, all) => {
          const fromEnd = all.length - 1 - i;
          const execution = fromEnd < streak ? "ahead" : "in";
          const bandLo = w.paceLoSKm + plan.qualityOffsetSecKm;
          const bandHi = w.paceHiSKm + plan.qualityOffsetSecKm;
          // The pace held over the reps: outside the fast end when the session
          // counts toward the streak, mid-band otherwise.
          const actual = execution === "ahead" ? bandLo - 12 : (bandLo + bandHi) / 2;
          return {
            workoutId: w.id,
            date: w.date,
            kind: w.kind,
            title: w.title,
            bandLoSKm: bandLo,
            bandHiSKm: bandHi,
            actualSKm: actual,
            measuredM: 2400,
            execution,
          };
        });
        return {
          reviews,
          streak: Math.min(streak, 3),
          direction: streak > 0 ? "ahead" : null,
          needed: 3,
          triggered: streak >= 3,
        };
      };
      // The receipt, in the order the backend orders it (most influential
      // first). Mirrors what `plan::receipt` emits for this plan: a 10K race
      // block, 40 km baseline, 4:45 threshold, 4 days a week, long run on
      // Sunday. ?offset=-5 adds the eighth line, the accepted adjustment.
      const receiptLines = () => {
        const lines = [
          {
            input: "10K on " + shortDate(ymd(-49)),
            sentence:
              "We have 7 weeks to your 10K, starting the week of 26 Aug, so the long run and the two quality days fit inside every week of the block.",
          },
          {
            input: "40 km a week",
            sentence:
              "We start at 40 km a week and build to 44 km, so the first week is the easiest week of the plan.",
          },
          {
            input: "4:45 per km",
            sentence:
              "Every pace in the plan is cut from this one number: 4:45 is your threshold, so tempo sits around it and easy days sit well back from it.",
          },
          {
            input: "4 runs a week",
            sentence:
              "That is 28 sessions across the block, with the easy days spread so no two hard days sit back to back.",
          },
          {
            input: "Moderate",
            sentence:
              "Volume grows by at most 8% a week — the rest of the build comes from the sessions getting harder, not the weeks getting much longer.",
          },
          {
            input: "Sunday",
            sentence:
              "The long run is a Sunday — 14 km at its furthest, and it stays on that day all the way through.",
          },
          {
            input: "The shape of the block",
            sentence:
              "2 recovery weeks cut the volume back every fourth week, the last week before the race tapers down and race day itself is a shakeout, not a session.",
          },
        ];
        if (plan.qualityOffsetSecKm !== 0) {
          lines.push({
            input: "Pacing adjustment",
            sentence:
              "Quality paces run sharper by 5 s/km from today — you accepted that after your recent tempo and interval reps.",
          });
        }
        return lines;
      };

      const offer = {
        id: "offer-1",
        bodyPart: "",
        signature: "pacing:ahead:p1",
        summary:
          "3 of the last 3 tempo sessions landed faster than the range — sharpen every quality pace by 5 s/km from today.",
        reason:
          "3 quality sessions in a row outside the range, all of them too fast. Oct 5 — held 4:28 min/km against 4:40-4:50. Oct 12 — held 4:26 min/km against 4:40-4:50. Oct 19 — held 4:29 min/km against 4:40-4:50. Easy days, long runs and race pace are untouched — only the tempo and interval ranges move.",
        edits: [],
        planQualityOffsetSecKm: -5,
        planQualityOffsetFrom: ymd(0),
        status: "pending",
        source: "pacing",
        createdAt: iso(0),
        actedAt: null,
      };

      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          switch (cmd) {
            case "current_plan":
              return [plan, workouts];
            case "plan_receipt":
              return receiptLines();
            case "run_scores":
              // A few done sessions carry a risk delta; the rest (and every
              // future week) render without a badge, which is the real
              // backend's normal state for runs whose risk did not move.
              return [
                { activityId: 1, workoutId: "w-6-tempo", load: 1.2, risk: 34, riskDelta: 5 },
                { activityId: 2, workoutId: "w-6-longRun", load: 1.35, risk: 31, riskDelta: -3 },
                { activityId: 3, workoutId: "w-5-tempo", load: 1.4, risk: 38, riskDelta: 7 },
                { activityId: 4, workoutId: "w-0-easy", load: 1.1, risk: 29, riskDelta: 1 },
                { activityId: 5, workoutId: "w-0-tempo", load: 1.25, risk: 33, riskDelta: 4 },
              ];
            case "pacing_report":
              return makeReport();
            case "pending_pacing_proposal":
              return Number(params.get("streak") ?? 2) >= 3 && !window.__offerAnswered ? offer : null;
            case "apply_proposal":
              // Mirrors the real command: the plan takes the offset and the
              // offer leaves the pending state.
              plan.qualityOffsetSecKm = offer.planQualityOffsetSecKm;
              plan.qualityOffsetFrom = offer.planQualityOffsetFrom;
              window.__offerAnswered = true;
              return workouts;
            case "dismiss_proposal":
              window.__offerAnswered = true;
              return null;
            case "plan_defaults":
              return {
                currentWeeklyKm: 40,
                thresholdSecKm: 285,
                predict5kS: 1010,
                predict10kS: 2130,
                predictHalfS: 4520,
                predictMarathonS: 9600,
                thisWeekKm: 12.4,
                totalKm: 812,
                weeksObserved: 4,
                lastSync: iso(1),
                activePain: null,
              };
            case "calendar_events":
              return workouts.map((w) => ({
                id: w.id,
                workoutId: w.id,
                activityId: null,
                date: w.date,
                kind: w.kind,
                title: w.title,
                distanceM: w.distanceM,
                durationMin: w.durationMin,
                notes: "Harness notes.",
                start: w.date,
                end: w.date,
                allDay: true,
              }));
            case "get_settings":
              return {
                pmtilesPath: null,
                lastProvider: "coros",
                theme: "system",
                llmEnabled: false,
                llmEndpoint: null,
                llmModel: null,
                thresholds: {
                  ratioDecreasingHi: 0.5,
                  ratioResumingHi: 0.8,
                  ratioMaintainingHi: 1.0,
                  ratioOptimizedHi: 1.5,
                  recoveryExhausted: 19,
                  recoveryFatigued: 69,
                  recoveryNormal: 89,
                  buildWeeks: 3,
                  downWeekFactor: 0.7,
                  paceToleranceSecKm: 4,
                  paceStreak: 3,
                },
              };
            case "provider_status":
              return [{ provider: "coros", connected: true, lastSync: iso(1), detail: "" }];
            case "flow_state":
              return { connected: true, lastSync: iso(1), plan: "p1", pushed: false };
            case "sync_status":
              return false;
            // ---- plan sync pill (F-24) ----
            // `?writer=1` makes this device the publisher, `?pill=` picks the
            // verdict, so every reading can be checked on either surface.
            case "plan_sync_status":
              return {
                config: {
                  enabled: true,
                  gistId: "gist-1",
                  hasToken: true,
                  canPublish: params.get("writer") === "1",
                  lastPushed: iso(1),
                  lastPulled: iso(2),
                  installedRev: 1_700_000_000,
                  lastError: null,
                },
                accountLinked: true,
                code: "abcdef1234567890",
              };
            case "plan_sync_check": {
              const kind = params.get("pill") ?? "update";
              if (kind === "off") return null;
              const statuses = {
                current: "upToDate",
                update: "updateAvailable",
                waiting: "importAvailable",
                other: "otherPlan",
                unpublished: "unpublished",
              };
              return {
                status: statuses[kind] ?? "upToDate",
                planName: "Half marathon on 06 Dec 2026",
                workouts: 36,
                // Two hours ago: recent enough to read as "min/hours ago".
                syncedAt: Math.floor(Date.now() / 1000) - 2 * 3600,
              };
            }
            case "plan_sync_push":
              window.__pushed = (window.__pushed ?? 0) + 1;
              return {
                enabled: true,
                gistId: "gist-1",
                hasToken: true,
                canPublish: true,
                lastPushed: new Date().toISOString(),
                lastPulled: null,
                installedRev: 1_700_000_000,
                lastError: null,
              };
            case "plan_sync_pull":
              window.__pulled = (window.__pulled ?? 0) + 1;
              return params.get("pill") === "other" && !args?.force
                ? { installed: false, planName: "", workouts: 0, conflict: "other-plan" }
                : {
                    installed: true,
                    planName: "Half marathon on 06 Dec 2026",
                    workouts: 36,
                    conflict: null,
                  };
            default:
              throw new Error("unstubbed " + cmd + " " + JSON.stringify(args));
          }
        },
      };
    </script>
    <script type="module">
      const page = await (await fetch("/plan.html")).text();
      const body = new DOMParser().parseFromString(page, "text/html").body;
      // Drop the page's own entry script; it is imported below, after the
      // markup exists, so plan.ts finds its elements.
      body.querySelectorAll("script").forEach((s) => s.remove());
      document.body.replaceChildren(...body.childNodes);
      await import("/src/plan.ts");
    </script>
  </head>
  <body></body>
</html>
